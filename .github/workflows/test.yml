  integration-tests:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Gated by run_tests (off for non-code); build + carve stay on run_code. The job ALWAYS runs and reports
    # success — it NEVER skips: a skipped check (even a non-required one) can stall GitHub's merge-queue
    # admission (the inert-PR N10 stall), so when there's nothing to run the steps no-op to green instead.
    # The real test run is gated to the PR + post-merge push; it no-ops in the merge queue (already ran on
    # the PR) — a green no-op, not a skip.
    permissions:
      contents: read
      packages: read

    env:
      # B2B/Customer integration tests restore Payment.Client/Contracts, now feed packages; 401 without this.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        project:
          - api/Concertable.B2B/src/Modules/Artist/Tests/Concertable.B2B.Artist.IntegrationTests/Concertable.B2B.Artist.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/Concert/Tests/Concertable.B2B.Concert.IntegrationTests/Concertable.B2B.Concert.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/Tenant/Tests/Concertable.B2B.Tenant.IntegrationTests/Concertable.B2B.Tenant.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/User/Tests/Concertable.B2B.User.IntegrationTests/Concertable.B2B.User.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/Venue/Tests/Concertable.B2B.Venue.IntegrationTests/Concertable.B2B.Venue.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/Concert/Tests/Concertable.Customer.Concert.IntegrationTests/Concertable.Customer.Concert.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/Review/Tests/Concertable.Customer.Review.IntegrationTests/Concertable.Customer.Review.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/Ticket/Tests/Concertable.Customer.Ticket.IntegrationTests/Concertable.Customer.Ticket.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/User/Tests/Concertable.Customer.User.IntegrationTests/Concertable.Customer.User.IntegrationTests.csproj
          - api/Concertable.Search/tests/Concertable.Search.IntegrationTests/Concertable.Search.IntegrationTests.csproj

    steps:
      - name: No-op (no code changed, or merge-queue re-run)
        if: needs.changes.outputs.run_tests != 'true' || github.event_name == 'merge_group'
        run: echo "Nothing to run here -> reporting success WITHOUT skipping the check (a skipped check can stall queue admission)."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_tests == 'true' && github.event_name != 'merge_group'

      - name: Set up .NET
        if: needs.changes.outputs.run_tests == 'true' && github.event_name != 'merge_group'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_tests == 'true' && github.event_name != 'merge_group'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run ${{ matrix.project }}
        if: needs.changes.outputs.run_tests == 'true' && github.event_name != 'merge_group'
        run: dotnet test ${{ matrix.project }} --configuration Release

  e2e-api-tests:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # No job-level event gate: gated by run_e2e in `changes`, which enables the real suite ONLY in the merge
    # queue (merge_group). On the PR and the post-merge push it no-ops to success — build + carve + unit +
    # integration gate the PR; the queue is the sole E2E gate.

    permissions:
      contents: read
      packages: read

    env:
      # Required: dotnet test restores the AppHost + Payment.Client/Contracts, which pull Auth's and
      # Payment's feed packages. Drop this and the merge-queue gate dies at restore (401) before any scenario runs.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      - name: Skip API E2E (no runtime change)
        if: needs.changes.outputs.run_e2e != 'true'
        run: echo "No runtime change (non-code or package-only) -> skipping API E2E; build + carve + unit + integration gate this."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Provision HTTPS dev certificate
        if: needs.changes.outputs.run_e2e == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: needs.changes.outputs.run_e2e == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/stripe/stripe-cli/releases/latest | grep -oE 'https://[^"]+_linux_x86_64\.tar\.gz' | head -1)
          test -n "$url" || { echo "Stripe CLI linux_x86_64 asset not found"; exit 1; }
          curl -fsSL "$url" -o /tmp/stripe.tar.gz
          sudo tar -xzf /tmp/stripe.tar.gz -C /usr/local/bin stripe
          stripe version

      - name: Install Azure Functions Core Tools
        if: needs.changes.outputs.run_e2e == 'true'
        # The B2B Workers host is an Azure Functions (v4) app; Aspire launches it via `dotnet run`,
        # which shells out to the `func` Core Tools. Without them the host never binds, so the
        # ConcertFinished* tests get "Connection refused (localhost:7078)" when triggering the timer.
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          func --version

      - name: Run B2B API E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet test api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests/Concertable.B2B.E2ETests.csproj --configuration Release --settings api/Concertable.runsettings

      - name: Run Customer API E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests/Concertable.Customer.E2ETests.csproj --configuration Release --settings api/Concertable.runsettings

      - name: Upload E2E diagnostics
        if: always() && needs.changes.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-diagnostics
          path: '**/e2e-diagnostics.log'
          if-no-files-found: ignore

  e2e-ui-tests:
    runs-on: ubuntu-latest
    needs: [build, e2e-api-tests, changes]
    # No job-level event gate (see e2e-api-tests): the real UI suite runs ONLY in the merge queue via
    # run_e2e_ui, no-opping to success on the PR. This is the BLOCKING lane — it excludes @quarantine
    # (Category!=quarantine); the flaky scenario runs in the separate non-gating e2e-ui-quarantine job.

    permissions:
      contents: read
      packages: read

    env:
      # Required: building the UI E2E projects restores the AppHost + Payment.Client/Contracts → Auth's and Payment's feed packages (see e2e-api-tests).
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      # Gated on run_e2e_ui: off for non-code and package-only changes.
      # Aggregated by ci-complete, which tolerates a skipped need, so it no-ops green when off.
      - name: Skip UI E2E (no runtime change)
        if: needs.changes.outputs.run_e2e_ui != 'true'
        run: echo "UI E2E gated off (non-code / package-only) -> build + carve gate this."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e_ui == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Provision HTTPS dev certificate
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: needs.changes.outputs.run_e2e_ui == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/stripe/stripe-cli/releases/latest | grep -oE 'https://[^"]+_linux_x86_64\.tar\.gz' | head -1)
          test -n "$url" || { echo "Stripe CLI linux_x86_64 asset not found"; exit 1; }
          curl -fsSL "$url" -o /tmp/stripe.tar.gz
          sudo tar -xzf /tmp/stripe.tar.gz -C /usr/local/bin stripe
          stripe version

      - name: Install Azure Functions Core Tools
        if: needs.changes.outputs.run_e2e_ui == 'true'
        # Same as the API E2E job: the full AppHost boots the B2B Workers Azure Functions host,
        # which needs the `func` Core Tools on PATH to launch.
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          func --version

      - name: Set up Node
        if: needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web SPA dependencies
        if: needs.changes.outputs.run_e2e_ui == 'true'
        # The UI E2E AppHost serves the venue/artist/business/customer SPAs via `npm run dev` (Vite).
        # They live in the app/ npm workspace; node_modules is gitignored, so without this the dev
        # servers never start and every scenario fails at warm-up with ERR_CONNECTION_REFUSED.
        working-directory: app
        run: npm ci

      - name: Build B2B UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: dotnet build api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj --configuration Release

      - name: Build Customer UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: dotnet build api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release

      - name: Install Playwright browsers
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: pwsh api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run B2B UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: dotnet test api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings --filter "Category!=quarantine"

      - name: Run Customer UI E2E tests
        if: needs.changes.outputs.run_e2e_ui == 'true'
        run: dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings --filter "Category!=quarantine"

      - name: Upload E2E diagnostics
        # Server logs + Playwright traces/screenshots for diagnosing a UI failure. Failure-only:
        # the trace bundle is large (~hundreds of MB), so don't upload it on green runs.
        if: failure() && needs.changes.outputs.run_e2e_ui == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-diagnostics
          path: |
            **/e2e-diagnostics.log
            **/playwright-traces/**
            **/playwright-failures/**
          if-no-files-found: ignore

  e2e-ui-quarantine:
    # The NON-GATING flake lane. Runs only @quarantine-tagged UI scenarios (Category=quarantine) and is
    # deliberately absent from ci-complete's needs, so a red here reports on the PR but never blocks a
    # merge. Runs on the PR only — a non-gating result in the queue would be wasted stack boot. A
    # quarantined scenario is tracked to be fixed and returned to the blocking lane, not carried forever.
    runs-on: ubuntu-latest
    needs: [build, changes]

    permissions:
      contents: read
      packages: read

    env:
      # No job-level `if` — the job ALWAYS runs and reports success. A skipped check (even a non-required
      # one like this) stalls GitHub's merge-queue admission (the inert-PR N10 stall). RUN gates the real
      # work to a PR that actually has UI changes; otherwise every step no-ops to green.
      RUN: ${{ needs.changes.outputs.run_e2e_ui == 'true' && github.event_name == 'pull_request' }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      - name: No-op (no UI change, or not a PR run)
        if: env.RUN != 'true'
        run: echo "No @quarantine UI scenarios to run here -> reporting success WITHOUT skipping the check (a skipped check can stall queue admission)."

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - name: Set up .NET
        if: env.RUN == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: env.RUN == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Provision HTTPS dev certificate
        if: env.RUN == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: env.RUN == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/stripe/stripe-cli/releases/latest | grep -oE 'https://[^"]+_linux_x86_64\.tar\.gz' | head -1)
          test -n "$url" || { echo "Stripe CLI linux_x86_64 asset not found"; exit 1; }
          curl -fsSL "$url" -o /tmp/stripe.tar.gz
          sudo tar -xzf /tmp/stripe.tar.gz -C /usr/local/bin stripe
          stripe version

      - name: Install Azure Functions Core Tools
        if: env.RUN == 'true'
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          func --version

      - name: Set up Node
        if: env.RUN == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web SPA dependencies
        if: env.RUN == 'true'
        working-directory: app
        run: npm ci

      - name: Build Customer UI E2E tests
        if: env.RUN == 'true'
        run: dotnet build api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release

      - name: Install Playwright browsers
        if: env.RUN == 'true'
        run: pwsh api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run quarantined Customer UI E2E scenarios
        if: env.RUN == 'true'
        run: dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings --filter "Category=quarantine"

      - name: Upload quarantine E2E diagnostics
        if: env.RUN == 'true' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-quarantine-diagnostics
          path: |
            **/e2e-diagnostics.log
            **/playwright-traces/**
            **/playwright-failures/**
          if-no-files-found: ignore

  ci-complete:
    # THE SINGLE REQUIRED STATUS CHECK (see plans/PIPELINE_REDESIGN.md Phase 1). It aggregates every real
    # CI job into one deterministic pass/fail that is NEVER `skipped`: `if: always()` runs it on every
    # event, and it passes iff nothing it needs failed or was cancelled. No gating job skips anymore — each
    # no-ops to success when it has nothing to do — so the whole suite is success-or-failure only, which is
    # what keeps GitHub's queue admission from stalling on a skipped check. needs EVERY gating job directly
    # (build + all carves + unit + integration + both e2e) so it reflects the full pipeline.
    runs-on: ubuntu-latest
    needs:
      - build
      - carve-auth
      - carve-payment
      - carve-search
      - carve-b2b
      - carve-customer
      - unit-tests
      - integration-tests
      - e2e-api-tests
      - e2e-ui-tests
    if: always()
    steps:
      - name: Fail if any CI job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result":[[:space:]]*"(failure|cancelled)"'; then
            echo "A CI job failed or was cancelled — blocking the merge."
            exit 1
          fi
          echo "All CI jobs passed (or were legitimately skipped) — ci-complete is green."
