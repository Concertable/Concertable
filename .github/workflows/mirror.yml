name: Mirror services to standalone repos

# Manual-only — OFF the hot path. Mirroring is a full 6-service history rewrite for a split-repo future
# nothing consumes yet; running it on every `main` push was per-merge cost for no current benefit (N7).
# Run it on demand when a mirror is actually needed; `mirror-parity.yml` (nightly) still flags drift.
on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Service mirrors:
          - prefix: api/Concertable.B2B
            repo: Concertable/b2b
          - prefix: api/Concertable.Customer
            repo: Concertable/customer
          - prefix: api/Concertable.Auth
            repo: Concertable/auth
          - prefix: api/Concertable.Payment
            repo: Concertable/payment
          - prefix: api/Concertable.Search
            repo: Concertable/search
          # Shared-platform mirror. Covers api/Concertable.Shared (Kernel, Contracts, Shared.*, Seed.*);
          # the other shared infra libs (Messaging, ServiceDefaults, DataAccess, AppHost.Shared,
          # Auth.Contracts) are separate top-level folders — finer splits deferred.
          - prefix: api/Concertable.Shared
            repo: Concertable/shared

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Don't persist the bot's GITHUB_TOKEN as an http.extraheader — it would hijack the
          # Authorization on the cross-repo push below (overriding the MIRROR_PAT URL creds) and
          # 403 as github-actions[bot]. The split is local; the push carries its own MIRROR_PAT creds.
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split ${{ matrix.prefix }} into its own history
        id: split
        run: |
          git subtree split --prefix=${{ matrix.prefix }} -b mirror-split
          echo "sha=$(git rev-parse mirror-split)" >> "$GITHUB_OUTPUT"

      - name: Force-push to ${{ matrix.repo }}
        run: |
          git push --force \
            "https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/${{ matrix.repo }}.git" \
            mirror-split:master

      - name: Verify ${{ matrix.repo }} matches the split commit
        env:
          EXPECTED_SHA: ${{ steps.split.outputs.sha }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${{ secrets.MIRROR_PAT }}@github.com/${{ matrix.repo }}.git"
          actual_sha="$(git ls-remote "$remote_url" refs/heads/master | awk '{print $1}')"
          test -n "$actual_sha" || { echo "Mirror master was not found"; exit 1; }
          test "$actual_sha" = "$EXPECTED_SHA" || {
            echo "Mirror drift after push: expected $EXPECTED_SHA, found $actual_sha"
            exit 1
          }
