name: Publish frontend packages

on:
  push:
    branches:
      - main
    paths:
      - 'app/shared/**'
      - 'app/web/shared/**'
      - 'app/mobile/shared/**'
      - 'app/customer/shared/**'
      - 'app/web/b2b/shared/**'
      - 'app/scripts/version-fe-packages.mjs'
      - 'app/scripts/verify-fe-package.mjs'
      - 'app/scripts/pack-fe-package-alias.mjs'
      - 'app/scripts/pack-fe-package-alias.test.mjs'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/publish-fe-packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fe-packages
  cancel-in-progress: true

jobs:
  publish-fe-packages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/app/.npmrc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # One lockstep version for every tier; --write also pins intra-@concertable deps to it.
      - name: Set package versions
        id: version
        run: |
          version=$(node app/scripts/version-fe-packages.mjs --write \
            app/shared app/web/shared app/mobile/shared app/customer/shared app/web/b2b/shared)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Dependency order: shared -> web/mobile/customer -> b2b. Each tier's prepack build leaves its
      # dist in place, so a later tier that imports an earlier one resolves it. Verify runs against the
      # packed tarball (pulling already-published deps from the feed), then publish idempotently.
      - name: Pack, verify, and publish tiers
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fe-packages"
          names=(@concertable/shared @concertable/web @concertable/mobile @concertable/customer @concertable/b2b)
          declare -A flags=(
            [@concertable/shared]="--metro"
            [@concertable/web]=""
            [@concertable/mobile]="--metro-only"
            [@concertable/customer]=""
            [@concertable/b2b]=""
          )
          for name in "${names[@]}"; do
            echo "::group::$name@$VERSION"
            ( cd app && npm pack --workspace "$name" --pack-destination "$RUNNER_TEMP/fe-packages" )
            tarball=$(ls -t "$RUNNER_TEMP/fe-packages"/*.tgz | head -n1)
            test -n "$tarball"
            node app/scripts/verify-fe-package.mjs "$tarball" "$name" ${flags[$name]}
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published"
            else
              npm publish "$tarball" --tag alpha
            fi
            echo "::endgroup::"
          done

          alias_name=@concertable/web-b2b
          echo "::group::$alias_name@$VERSION"
          alias_tarball=$(node app/scripts/pack-fe-package-alias.mjs \
            app/web/b2b/shared "$alias_name" "$RUNNER_TEMP/fe-packages")
          node app/scripts/verify-fe-package.mjs "$alias_tarball" "$alias_name"
          if npm view "$alias_name@$VERSION" version >/dev/null 2>&1; then
            echo "$alias_name@$VERSION is already published"
          else
            npm publish "$alias_tarball" --tag alpha
          fi
          echo "::endgroup::"

      # Feed sanity: confirm each tier resolves from the registry (not just the local tarball).
      - name: Verify published tiers from the feed
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          node app/scripts/verify-fe-package.mjs "@concertable/shared@$VERSION" @concertable/shared --metro
          node app/scripts/verify-fe-package.mjs "@concertable/web@$VERSION" @concertable/web
          node app/scripts/verify-fe-package.mjs "@concertable/mobile@$VERSION" @concertable/mobile --metro-only
          node app/scripts/verify-fe-package.mjs "@concertable/customer@$VERSION" @concertable/customer
          node app/scripts/verify-fe-package.mjs "@concertable/b2b@$VERSION" @concertable/b2b
          node app/scripts/verify-fe-package.mjs "@concertable/web-b2b@$VERSION" @concertable/web-b2b
