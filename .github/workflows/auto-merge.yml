name: Auto-merge

# A ready (non-draft) PR into main gets GitHub auto-merge enabled, so the merge queue lands it once
# its required checks are green. Drafts never auto-merge — flipping a PR to ready IS the merge-intent
# signal; keep a PR in draft while you're still iterating.
#
# Safety is the merge queue's, not this workflow's: a red PR is ejected and never reaches main, and
# the PRs behind it re-base onto clean main untouched. This only SCHEDULES the merge into the queue —
# it cannot make a red PR land. No required-review rule, so a green PR merges unreviewed (the accepted
# trade for a queue-gated personal repo — mark ready only when you mean it).
#
# THE STALL THIS KILLS (two distinct failure modes, both silent — GitHub never errors, the PR just sits
# OPEN forever):
#
# 1. CLEAN but never admitted. Enabling auto-merge while a required check is still PENDING can leave a
#    PR CLEAN + auto-merge-ON but NEVER admitted to the queue — GitHub stops re-evaluating admission
#    once a required check resolves to `skipped` (our non-code classifier skips e2e/unit/integration,
#    so those required checks end `skipped`, not `success`). The cure is a disable -> enable TOGGLE
#    once the PR is mergeable, which forces GitHub to re-evaluate and admit it.
#
# 2. Admitted but never dispatched (PR #216, 2026-07-26). `mergeQueueEntry` goes non-null (state
#    AWAITING_CHECKS, a real queue position) but GitHub never actually fires the `merge_group` workflow
#    run for it — `gh run list --event merge_group` shows zero runs for that PR, ever. This used to be
#    invisible to this workflow: the old guard treated ANY non-null `mergeQueueEntry` as "already
#    queued, healthy" and skipped it on every sweep, forever — a `--disable-auto`/`--auto` toggle also
#    silently no-ops here (`gh pr merge` refuses to touch a PR already owned by the queue). The only fix
#    is the GraphQL `dequeuePullRequest` mutation (input `id` = the PR's own node id, NOT the queue
#    entry's id) to actually evict it, then `gh pr merge --auto` to request a fresh, genuine admission.
#    Detected by: `mergeQueueEntry.state == AWAITING_CHECKS`, zero merge_group runs for this PR, and
#    `enqueuedAt` older than 15 minutes (a queue entry legitimately waiting behind others ahead of it in
#    the queue is not stuck — only "no CI activity at all, for a long time" is).
#
# This workflow is two bolted-on heuristics deep for the same root problem (GitHub's merge queue
# silently failing to progress a PR, in different ways, with no reliable signal to detect it up front).
# That is real tech debt, not a design — logged in TECH_DEBT.md. A third failure mode should not get a
# third `if` branch; it should trigger rethinking whether polling-and-patching this from the outside is
# still the right approach.
#
# WHY NOT `check_suite: completed` (the previous, silently-dead approach): GitHub does not dispatch
# check_suite / check_run events for suites created by GITHUB_TOKEN (recursion guard), and every check
# here is a GITHUB_TOKEN Actions run — so that trigger fired exactly zero times. The reliable signals:
#   - `workflow_run: completed` on CI DOES fire after a GITHUB_TOKEN workflow finishes (its purpose), so
#     the re-assert runs promptly once a PR's checks conclude;
#   - `schedule` fires unconditionally as a backstop, catching anything the events miss.
# The signal we actually want ("required checks concluded") is not directly observable, so instead of
# targeting one PR we idempotently sweep every ready PR on each trigger and nudge only the stuck ones.

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-reassert
  cancel-in-progress: false

jobs:
  reassert:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-assert auto-merge on ready PRs stuck outside the queue
        run: |
          owner="${GH_REPO%%/*}"; repo="${GH_REPO##*/}"

          nums="$(gh pr list --state open --base main --draft=false --json number -q '.[].number' 2>/dev/null)"
          [ -n "$nums" ] || { echo "No open ready PRs into main — nothing to do."; exit 0; }

          for n in $nums; do
            [ -n "$n" ] || continue

            # Already queued (or mid-merge)? Normally leave it — toggling --disable-auto/--auto here
            # would just eject it. But detect failure mode 2 (admitted, never dispatched) and recover.
            entry="$(gh api graphql -f query="{repository(owner:\"$owner\",name:\"$repo\"){pullRequest(number:$n){id mergeQueueEntry{state enqueuedAt}}}}" 2>/dev/null || echo '{}')"
            prNodeId="$(echo "$entry" | jq -r '.data.repository.pullRequest.id // empty')"
            mqState="$(echo "$entry" | jq -r '.data.repository.pullRequest.mergeQueueEntry.state // empty')"
            enqueuedAt="$(echo "$entry" | jq -r '.data.repository.pullRequest.mergeQueueEntry.enqueuedAt // empty')"

            if [ -n "$mqState" ]; then
              runCount="$(gh run list --event merge_group -L 40 --json headBranch \
                -q "[.[] | select(.headBranch | contains(\"/pr-$n-\"))] | length" 2>/dev/null || echo 0)"
              ageSec=0
              if [ -n "$enqueuedAt" ]; then
                enqEpoch="$(date -d "$enqueuedAt" +%s 2>/dev/null || echo 0)"
                [ "$enqEpoch" -gt 0 ] && ageSec=$(( $(date +%s) - enqEpoch ))
              fi
              if [ "$mqState" = "AWAITING_CHECKS" ] && [ "${runCount:-0}" = "0" ] && [ "$ageSec" -gt 900 ] && [ -n "$prNodeId" ]; then
                echo "PR #$n: STUCK — queued $((ageSec/60))m ago, state=$mqState, zero merge_group runs ever. Dequeuing + re-enqueuing."
                gh api graphql -f query='mutation($id:ID!){dequeuePullRequest(input:{id:$id}){clientMutationId}}' -f id="$prNodeId" >/dev/null 2>&1 || true
                gh pr merge --auto "$n" >/dev/null 2>&1 || true
              else
                echo "PR #$n: already queued (state=$mqState) — leave it"
              fi
              continue
            fi

            # Don't re-add a PR whose current head already failed in the queue, or it loops (eject -> re-add ->
            # fail). Match by PR number; timestamp-gate because the queue branch's SHA is main's base, not the head.
            head_time="$(gh pr view "$n" --json commits -q '.commits[-1].committedDate' 2>/dev/null)"
            last_fail_time="$(gh run list --event merge_group -L 40 --json headBranch,conclusion,createdAt \
              -q "[.[] | select(.headBranch | contains(\"/pr-$n-\")) | select(.conclusion==\"failure\") | .createdAt] | max // empty" 2>/dev/null)"
            if [ -n "$last_fail_time" ] && [ -n "$head_time" ] && [[ "$last_fail_time" > "$head_time" ]]; then
              echo "PR #$n: current head already failed a merge_group run ($last_fail_time > head $head_time) — ejected for cause, not re-adding. Push a fix to re-queue."
              continue
            fi

            state="$(gh pr view "$n" --json mergeStateStatus -q '.mergeStateStatus' 2>/dev/null || echo UNKNOWN)"

            # No strategy flag: the merge queue owns the method; passing --squash/--merge/--rebase makes
            # gh reject the command.
            case "$state" in
              CLEAN|UNSTABLE)
                # Mergeable but not queued = the stall. Toggle to force GitHub to re-evaluate admission.
                echo "PR #$n: state=$state, not queued — toggling auto-merge to force admission"
                gh pr merge --disable-auto "$n" >/dev/null 2>&1 || true
                gh pr merge --auto "$n"
                ;;
              *)
                # Not yet mergeable (pending / behind / blocked): just ensure auto-merge is enabled — the
                # queue admits it when it goes green, and the next sweep toggles it if it stalls CLEAN.
                echo "PR #$n: state=$state — ensuring auto-merge is enabled, waiting on checks"
                gh pr merge --auto "$n" >/dev/null 2>&1 || true
                ;;
            esac
          done
