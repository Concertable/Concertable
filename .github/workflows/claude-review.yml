name: Claude PR Review

on:
  pull_request:
    types: [labeled]

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          prompt: |
            Review this PR for Concertable, a .NET 10 / React platform of independent microservices.
            Your final response will be posted verbatim as a PR comment, so write it as a review.

            Follow the repo-root `AGENTS.md`. Do not review from memory of the conventions: read
            `.agents/skill-routes.json`, and for every changed path load the skills it names — each is
            the single home of its rule, so restating one here would just drift from it. The pairs that
            matter most for backend changes are `module-structure` + `concertable-module-structure`,
            `persistence` + `concertable-persistence`, `multitenancy`, `http-api` +
            `concertable-http-api`, and `concertable-migrations`.

            Be terse. Flag real issues only — don't nit-pick style or restate what the diff does.
            Group findings as: 🔴 Bugs/regressions, 🟡 Suggestions, 🟣 Pre-existing debt to ignore.
            If there are no real issues, say so in one sentence.
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"
