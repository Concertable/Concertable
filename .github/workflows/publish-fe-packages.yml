name: Publish frontend packages

on:
  push:
    branches:
      - main
    paths:
      - 'app/shared/**'
      - 'app/scripts/version-fe-packages.mjs'
      - 'app/scripts/verify-fe-package.mjs'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/publish-fe-packages.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-fe-packages
  cancel-in-progress: true

jobs:
  publish-shared:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/app/.npmrc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Set package version
        id: version
        run: |
          version=$(node app/scripts/version-fe-packages.mjs --write app/shared)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack package
        id: pack
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/fe-packages"
          npm pack --workspace @concertable/shared --pack-destination "$RUNNER_TEMP/fe-packages"
          tarball=$(find "$RUNNER_TEMP/fe-packages" -maxdepth 1 -name '*.tgz' -print -quit)
          test -n "$tarball"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Verify packed package
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node app/scripts/verify-fe-package.mjs "$TARBALL" --metro

      - name: Publish package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          if npm view "@concertable/shared@$VERSION" version >/dev/null 2>&1; then
            echo "@concertable/shared@$VERSION is already published"
          else
            npm publish "$TARBALL" --tag alpha
          fi

      - name: Verify published package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node app/scripts/verify-fe-package.mjs "@concertable/shared@$VERSION"
