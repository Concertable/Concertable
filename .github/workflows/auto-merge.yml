name: Auto-merge

# A ready (non-draft) PR into master gets GitHub auto-merge enabled, so the merge queue lands it once
# its required checks are green. Drafts never auto-merge — flipping a PR to ready IS the merge-intent
# signal; keep a PR in draft while you're still iterating.
#
# Safety is the merge queue's, not this workflow's: a red PR is ejected and never reaches master, and
# the PRs behind it re-base onto clean master untouched. This only SCHEDULES the merge into the queue —
# it cannot make a red PR land. No required-review rule, so a green PR merges unreviewed (the accepted
# trade for a queue-gated personal repo — mark ready only when you mean it).
#
# THE STALL THIS KILLS: enabling auto-merge while a required check is still PENDING can leave a PR
# CLEAN + auto-merge-ON but NEVER admitted to the queue — GitHub stops re-evaluating admission once a
# required check resolves to `skipped` (our non-code classifier skips e2e/unit/integration, so those
# required checks end `skipped`, not `success`). The PR sits green-but-un-queued forever. The cure is a
# disable -> enable TOGGLE once the PR is mergeable, which forces GitHub to re-evaluate and admit it.
#
# WHY NOT `check_suite: completed` (the previous, silently-dead approach): GitHub does not dispatch
# check_suite / check_run events for suites created by GITHUB_TOKEN (recursion guard), and every check
# here is a GITHUB_TOKEN Actions run — so that trigger fired exactly zero times. The reliable signals:
#   - `workflow_run: completed` on CI DOES fire after a GITHUB_TOKEN workflow finishes (its purpose), so
#     the re-assert runs promptly once a PR's checks conclude;
#   - `schedule` fires unconditionally as a backstop, catching anything the events miss.
# The signal we actually want ("required checks concluded") is not directly observable, so instead of
# targeting one PR we idempotently sweep every ready PR on each trigger and nudge only the stuck ones.

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [master]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-reassert
  cancel-in-progress: false

jobs:
  reassert:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Re-assert auto-merge on ready PRs stuck outside the queue
        run: |
          owner="${GH_REPO%%/*}"; repo="${GH_REPO##*/}"

          nums="$(gh pr list --state open --base master --draft=false --json number -q '.[].number' 2>/dev/null)"
          [ -n "$nums" ] || { echo "No open ready PRs into master — nothing to do."; exit 0; }

          for n in $nums; do
            [ -n "$n" ] || continue

            # Already queued (or mid-merge)? Never toggle — that would DISABLE auto-merge and eject it.
            queued="$(gh api graphql -f query="{repository(owner:\"$owner\",name:\"$repo\"){pullRequest(number:$n){mergeQueueEntry{state}}}}" \
              -q '.data.repository.pullRequest.mergeQueueEntry != null' 2>/dev/null || echo unknown)"
            if [ "$queued" = "true" ]; then echo "PR #$n: already queued — leave it"; continue; fi

            state="$(gh pr view "$n" --json mergeStateStatus -q '.mergeStateStatus' 2>/dev/null || echo UNKNOWN)"

            # No strategy flag: the merge queue owns the method; passing --squash/--merge/--rebase makes
            # gh reject the command.
            case "$state" in
              CLEAN|UNSTABLE)
                # Mergeable but not queued = the stall. Toggle to force GitHub to re-evaluate admission.
                echo "PR #$n: state=$state, not queued — toggling auto-merge to force admission"
                gh pr merge --disable-auto "$n" >/dev/null 2>&1 || true
                gh pr merge --auto "$n"
                ;;
              *)
                # Not yet mergeable (pending / behind / blocked): just ensure auto-merge is enabled — the
                # queue admits it when it goes green, and the next sweep toggles it if it stalls CLEAN.
                echo "PR #$n: state=$state — ensuring auto-merge is enabled, waiting on checks"
                gh pr merge --auto "$n" >/dev/null 2>&1 || true
                ;;
            esac
          done
