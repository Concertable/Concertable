name: Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  merge_group:
    branches:
      - master

jobs:
  changes:
    # Classify the diff once so the rest of CI runs only what's relevant. Three outcomes:
    #   - non-code    (docs / .claude / .github CI config / plans / reviews / root dotfiles) -> run_code=false, run_e2e=false
    #                 no app-code impact: build + carve + unit + integration + E2E all no-op. (A CI-config change
    #                 is validated by the workflow simply running — not by the app test suites.)
    #   - package-only (nothing but Directory.Packages.props — e.g. platform-sync) -> run_code=true, run_e2e=false
    #                 a dep bump can break compile/tests so those still gate, but it has ZERO runtime delta so E2E no-ops.
    #   - anything else                                                       -> run_code=true, run_e2e=true (full CI).
    # Runs on pull_request AND merge_group AND push so the skip applies on the PR too, not just in the queue.
    # NOTE: required checks (build / carve-* / e2e-*) still RUN when gated off — they no-op their steps and report
    # success. A *skipped* required check stalls the merge queue until check_response_timeout (60 min); a green no-op
    # does not. Non-required jobs (unit-tests / integration-tests) can skip cleanly — ci-gate tolerates skipped needs.
    runs-on: ubuntu-latest
    outputs:
      run_code: ${{ steps.detect.outputs.run_code }}
      run_e2e: ${{ steps.detect.outputs.run_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: detect
        run: |
          case "${{ github.event_name }}" in
            merge_group)  base="${{ github.event.merge_group.base_sha }}";  head="${{ github.event.merge_group.head_sha }}";;
            pull_request) base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}";;
            push)         base="${{ github.event.before }}";                head="${{ github.event.after }}";;
            *)            base=""; head="";;
          esac
          echo "event=${{ github.event_name }} base=$base head=$head"
          # No usable range (missing sha, first push with a zero base, unfetched commit) -> fail safe to full CI.
          if [ -z "$base" ] || [ -z "$head" ] \
             || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse -q --verify "$base^{commit}" >/dev/null \
             || ! git rev-parse -q --verify "$head^{commit}" >/dev/null; then
            echo "-> no usable diff range; running full CI."
            echo "run_code=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; printf '%s\n' "$files"
          # Inert = cannot affect any build or test: markdown anywhere, and the doc/tooling trees.
          INERT='(\.md$|^\.claude/|^\.github/|^docs/|^plans/|^reviews/|^\.gitignore$|^\.gitattributes$|^LICENSE$)'
          PKG='(^|/)Directory\.Packages\.props$'
          run_code=true
          run_e2e=true
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$INERT"; then
            run_code=false
            run_e2e=false
            echo "-> non-code change; skipping build + carve + unit + integration + E2E."
          elif [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE "$PKG"; then
            run_e2e=false
            echo "-> package-only bump; build + carve + unit + integration gate, E2E no-ops."
          else
            echo "-> code change; full CI."
          fi
          echo "run_code=$run_code" >> "$GITHUB_OUTPUT"
          echo "run_e2e=$run_e2e"  >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: changes
    permissions:
      contents: read
      packages: read

    env:
      # Feed credential: the slnx build restores Auth's and Payment's feed packages; the repo token reads the org's own packages.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip build (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to compile; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build solution
        if: needs.changes.outputs.run_code == 'true'
        run: dotnet build api/Concertable.slnx --configuration Release

  carve-auth:
    # Gate: Concertable.Auth must build standalone from its own package closure — a ProjectReference
    # escaping api/Concertable.Auth/ fails here (project-not-found) instead of silently at a repo split.
    # Use `git archive`, not `git subtree split`: the split rewrites the folder's whole history and is
    # far too slow for a gate; archive extracts the tracked tree at HEAD instantly (no fetch-depth: 0).
    runs-on: ubuntu-latest
    needs: [build, changes]
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Carve api/Concertable.Auth into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Auth | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Auth tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Auth from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        run: dotnet build src/Concertable.Auth/Concertable.Auth.csproj --configuration Release

  carve-payment:
    # Gate: Concertable.Payment's deployable closure must build standalone from its own package
    # closure — a ProjectReference escaping api/Concertable.Payment/ fails here (project-not-found)
    # instead of silently at a repo split. Same `git archive` technique as carve-auth.
    # Build a closure-only solution, NOT the .slnx: the slnx also carries AppHost.Extensions and the
    # E2ETests.Helpers harness, which reference cross-folder projects (Concertable.AppHost.Shared,
    # Concertable.E2ETests) that are absent from the carve and exempt by design (composition / E2E
    # harness layers). The solution lists every package-clean project so each is built directly.
    runs-on: ubuntu-latest
    needs: [build, changes]
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Carve api/Concertable.Payment into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Payment | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Payment tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Payment deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # One closure-only solution → a single feed restore, and every package-clean project is built
        # directly, so a future ref-removal can't orphan one from the gate (e.g. Api, reached only via Web).
        # MinVerSkip: the carved tree has no .git, so MinVer can't derive a version — irrelevant for a build-only gate.
        run: |
          dotnet new sln --name CarvePayment --format slnx
          dotnet sln CarvePayment.slnx add \
            src/Concertable.Payment.Web/Concertable.Payment.Web.csproj \
            src/Concertable.Payment.Workers/Concertable.Payment.Workers.csproj \
            src/Concertable.Payment.Client/Concertable.Payment.Client.csproj \
            src/Concertable.Payment.Api/Concertable.Payment.Api.csproj \
            src/Concertable.Payment.Application/Concertable.Payment.Application.csproj \
            src/Concertable.Payment.Infrastructure/Concertable.Payment.Infrastructure.csproj \
            src/Concertable.Payment.Domain/Concertable.Payment.Domain.csproj \
            src/Concertable.Payment.Contracts/Concertable.Payment.Contracts.csproj \
            src/Seed/Concertable.Payment.Seed/Concertable.Payment.Seed.csproj
          dotnet build CarvePayment.slnx --configuration Release -p:MinVerSkip=true

  carve-search:
    # Gate: Concertable.Search's deployable closure must build standalone from its own package
    # closure — a ProjectReference escaping api/Concertable.Search/ fails here (project-not-found)
    # instead of silently at a repo split. Same `git archive` technique as carve-auth/carve-payment.
    # Build a closure-only solution, NOT the .slnx: the slnx also carries AppHost.Extensions and the
    # IntegrationTests/E2ETests.Helpers harness, which reference cross-folder projects
    # (Concertable.AppHost.Shared, Concertable.Testing*) absent from the carve and exempt by design
    # (composition / test-harness layers). The solution lists every package-clean project so each is
    # built directly. Search publishes nothing, so its folder carries no MinVer (no MinVerSkip needed).
    runs-on: ubuntu-latest
    needs: [build, changes]
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Carve api/Concertable.Search into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Search | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Search tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Search deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # One closure-only solution → a single feed restore, and every package-clean project is built
        # directly, so a future ref-removal can't orphan one from the gate (e.g. Api, reached only via Web).
        run: |
          dotnet new sln --name CarveSearch --format slnx
          dotnet sln CarveSearch.slnx add \
            src/Concertable.Search.Web/Concertable.Search.Web.csproj \
            src/Concertable.Search.Workers/Concertable.Search.Workers.csproj \
            src/Concertable.Search.Api/Concertable.Search.Api.csproj \
            src/Concertable.Search.Application/Concertable.Search.Application.csproj \
            src/Concertable.Search.Infrastructure/Concertable.Search.Infrastructure.csproj \
            src/Concertable.Search.Domain/Concertable.Search.Domain.csproj \
            src/Seed/Concertable.Search.Seed.Infrastructure/Concertable.Search.Seed.Infrastructure.csproj
          dotnet build CarveSearch.slnx --configuration Release

  carve-b2b:
    # Gate: Concertable.B2B's deployable closure must build standalone from its own package closure —
    # a ProjectReference escaping api/Concertable.B2B/ fails here (project-not-found) instead of
    # silently at a repo split. Same `git archive` technique as carve-auth/carve-payment/carve-search.
    # Build a closure-only solution, NOT the .slnx: the slnx also carries AppHost(.Extensions) and the
    # IntegrationTests/E2ETests harness, which reference cross-folder projects (Concertable.AppHost.Shared,
    # Concertable.Testing*, Payment/Search E2E helpers) absent from the carve and exempt by design
    # (composition / test-harness layers). The closure is large (42 projects), so discover it as "every
    # csproj that is not a test or AppHost project" — every package-clean project is built directly, and
    # a new closure project (or a leaf reached only transitively) is picked up automatically, never orphaned.
    runs-on: ubuntu-latest
    needs: [build, changes]
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Carve api/Concertable.B2B into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.B2B | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.B2B tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved B2B deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # MinVerSkip: the carved tree has no .git, so MinVer can't derive a version — irrelevant for a build-only gate.
        run: |
          dotnet new sln --name CarveB2B --format slnx
          # Closure = every csproj except the test (Tests/) and AppHost (composition) projects, which
          # legitimately reference cross-folder projects absent from the carve. Path/name based, so it
          # can't drift on comment wording and auto-includes new or transitively-only-reached projects.
          mapfile -t PROJS < <(find . -name '*.csproj' \
            -not -path '*/Tests/*' \
            -not -path '*/tests/*' \
            -not -path '*/obj/*' \
            -not -name 'Concertable.B2B.AppHost.csproj' \
            -not -name 'Concertable.B2B.AppHost.Extensions.csproj')
          echo "Package-clean closure projects (${#PROJS[@]}):"
          printf '%s\n' "${PROJS[@]}"
          dotnet sln CarveB2B.slnx add "${PROJS[@]}"
          dotnet build CarveB2B.slnx --configuration Release -p:MinVerSkip=true

  carve-customer:
    # Gate: Concertable.Customer's deployable closure must build standalone from its own package closure —
    # a ProjectReference escaping api/Concertable.Customer/ fails here (project-not-found) instead of
    # silently at a repo split. Same `git archive` technique as carve-auth/carve-payment/carve-search/carve-b2b.
    # Build a closure-only solution, NOT the .slnx: the slnx also carries AppHost(.Extensions) and the
    # IntegrationTests/E2ETests harness, which reference cross-folder projects (Concertable.AppHost.Shared,
    # Concertable.Testing*, Payment/Search E2E helpers) absent from the carve and exempt by design
    # (composition / test-harness layers). The closure is large, so discover it as "every csproj that is
    # not a test or AppHost project" — every package-clean project is built directly, and a new closure
    # project (or a leaf reached only transitively) is picked up automatically, never orphaned.
    runs-on: ubuntu-latest
    needs: [build, changes]
    permissions:
      contents: read
      packages: read

    env:
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Skip carve (no code changed)
        if: needs.changes.outputs.run_code != 'true'
        run: echo "No code changed -> nothing to carve; required check reports success."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_code == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_code == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Carve api/Concertable.Customer into a standalone tree
        if: needs.changes.outputs.run_code == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/carve"
          git archive HEAD:api/Concertable.Customer | tar -x -C "$RUNNER_TEMP/carve"
          echo "Carved tree (only api/Concertable.Customer tracked files):"
          ls -la "$RUNNER_TEMP/carve"

      - name: Restore + build the carved Customer deployable closure from the feed (packages only)
        if: needs.changes.outputs.run_code == 'true'
        working-directory: ${{ runner.temp }}/carve
        # MinVerSkip: the carved tree has no .git, so MinVer can't derive a version — irrelevant for a build-only gate.
        run: |
          dotnet new sln --name CarveCustomer --format slnx
          # Closure = every csproj except the test (Tests/) and AppHost (composition) projects, which
          # legitimately reference cross-folder projects absent from the carve. Path/name based, so it
          # can't drift on comment wording and auto-includes new or transitively-only-reached projects.
          mapfile -t PROJS < <(find . -name '*.csproj' \
            -not -path '*/Tests/*' \
            -not -path '*/tests/*' \
            -not -path '*/obj/*' \
            -not -name 'Concertable.Customer.AppHost.csproj' \
            -not -name 'Concertable.Customer.AppHost.Extensions.csproj')
          echo "Package-clean closure projects (${#PROJS[@]}):"
          printf '%s\n' "${PROJS[@]}"
          dotnet sln CarveCustomer.slnx add "${PROJS[@]}"
          dotnet build CarveCustomer.slnx --configuration Release -p:MinVerSkip=true

  unit-tests:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Not a required check (ci-gate aggregates it) — so it can skip cleanly for a non-code change.
    if: needs.changes.outputs.run_code == 'true'
    permissions:
      contents: read
      packages: read

    env:
      # Payment's test graph — and B2B/Customer's via Payment.Client/Contracts — restores feed packages now; 401 without this.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        project:
          - api/Concertable.B2B/src/Modules/Concert/Tests/Concertable.B2B.Concert.UnitTests/Concertable.B2B.Concert.UnitTests.csproj
          - api/Concertable.B2B/src/Modules/Deal/Tests/Concertable.B2B.Deal.UnitTests/Concertable.B2B.Deal.UnitTests.csproj
          - api/Concertable.B2B/src/Modules/Tenant/Tests/Concertable.B2B.Tenant.UnitTests/Concertable.B2B.Tenant.UnitTests.csproj
          - api/Concertable.B2B/tests/Concertable.B2B.Workers.UnitTests/Concertable.B2B.Workers.UnitTests.csproj
          - api/Concertable.Customer/src/Modules/Concert/Tests/Concertable.Customer.Concert.UnitTests/Concertable.Customer.Concert.UnitTests.csproj
          - api/Concertable.Customer/src/Modules/Review/Tests/Concertable.Customer.Review.UnitTests/Concertable.Customer.Review.UnitTests.csproj
          - api/Concertable.Customer/src/Modules/Ticket/Tests/Concertable.Customer.Ticket.UnitTests/Concertable.Customer.Ticket.UnitTests.csproj
          - api/Concertable.Customer/src/Modules/User/Tests/Concertable.Customer.User.UnitTests/Concertable.Customer.User.UnitTests.csproj
          - api/Concertable.Messaging/Tests/Concertable.Messaging.UnitTests/Concertable.Messaging.UnitTests.csproj
          - api/Concertable.Messaging/Tests/Concertable.Messaging.AzureServiceBus.UnitTests/Concertable.Messaging.AzureServiceBus.UnitTests.csproj
          - api/Concertable.Payment/tests/Concertable.Payment.UnitTests/Concertable.Payment.UnitTests.csproj
          - api/Concertable.Search/tests/Concertable.Search.UnitTests/Concertable.Search.UnitTests.csproj
          - api/Concertable.Shared/tests/Concertable.Kernel.UnitTests/Concertable.Kernel.UnitTests.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run ${{ matrix.project }}
        run: dotnet test ${{ matrix.project }} --configuration Release

  integration-tests:
    runs-on: ubuntu-latest
    needs: [build, changes]
    # Not a required check (ci-gate aggregates it) — so it can skip cleanly for a non-code change.
    if: needs.changes.outputs.run_code == 'true'
    permissions:
      contents: read
      packages: read

    env:
      # B2B/Customer integration tests restore Payment.Client/Contracts, now feed packages; 401 without this.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        project:
          - api/Concertable.B2B/src/Modules/Artist/Tests/Concertable.B2B.Artist.IntegrationTests/Concertable.B2B.Artist.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/Concert/Tests/Concertable.B2B.Concert.IntegrationTests/Concertable.B2B.Concert.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/Tenant/Tests/Concertable.B2B.Tenant.IntegrationTests/Concertable.B2B.Tenant.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/User/Tests/Concertable.B2B.User.IntegrationTests/Concertable.B2B.User.IntegrationTests.csproj
          - api/Concertable.B2B/src/Modules/Venue/Tests/Concertable.B2B.Venue.IntegrationTests/Concertable.B2B.Venue.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/Concert/Tests/Concertable.Customer.Concert.IntegrationTests/Concertable.Customer.Concert.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/Review/Tests/Concertable.Customer.Review.IntegrationTests/Concertable.Customer.Review.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/Ticket/Tests/Concertable.Customer.Ticket.IntegrationTests/Concertable.Customer.Ticket.IntegrationTests.csproj
          - api/Concertable.Customer/src/Modules/User/Tests/Concertable.Customer.User.IntegrationTests/Concertable.Customer.User.IntegrationTests.csproj
          - api/Concertable.Search/tests/Concertable.Search.IntegrationTests/Concertable.Search.IntegrationTests.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Run ${{ matrix.project }}
        run: dotnet test ${{ matrix.project }} --configuration Release

  ci-gate:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - name: Fail if any unit or integration job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -qE '"result":[[:space:]]*"(failure|cancelled)"'; then
            echo "A unit/integration matrix job failed or was cancelled — blocking the merge."
            exit 1
          fi
          echo "All unit + integration jobs passed (or were skipped for a non-code change)."

  e2e-api-tests:
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: github.event_name == 'merge_group'

    permissions:
      contents: read
      packages: read

    env:
      # Required: dotnet test restores the AppHost + Payment.Client/Contracts, which pull Auth's and
      # Payment's feed packages. Drop this and the merge-queue gate dies at restore (401) before any scenario runs.
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      - name: Skip API E2E (no runtime change)
        if: needs.changes.outputs.run_e2e != 'true'
        run: echo "No runtime change (non-code or package-only) -> skipping API E2E; build + carve + unit + integration gate this."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Provision HTTPS dev certificate
        if: needs.changes.outputs.run_e2e == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: needs.changes.outputs.run_e2e == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/stripe/stripe-cli/releases/latest | grep -oE 'https://[^"]+_linux_x86_64\.tar\.gz' | head -1)
          test -n "$url" || { echo "Stripe CLI linux_x86_64 asset not found"; exit 1; }
          curl -fsSL "$url" -o /tmp/stripe.tar.gz
          sudo tar -xzf /tmp/stripe.tar.gz -C /usr/local/bin stripe
          stripe version

      - name: Install Azure Functions Core Tools
        if: needs.changes.outputs.run_e2e == 'true'
        # The B2B Workers host is an Azure Functions (v4) app; Aspire launches it via `dotnet run`,
        # which shells out to the `func` Core Tools. Without them the host never binds, so the
        # ConcertFinished* tests get "Connection refused (localhost:7078)" when triggering the timer.
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          func --version

      - name: Run B2B API E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet test api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests/Concertable.B2B.E2ETests.csproj --configuration Release --settings api/Concertable.runsettings

      - name: Run Customer API E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests/Concertable.Customer.E2ETests.csproj --configuration Release --settings api/Concertable.runsettings

      - name: Upload E2E diagnostics
        if: always() && needs.changes.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-api-diagnostics
          path: '**/e2e-diagnostics.log'
          if-no-files-found: ignore

  e2e-ui-tests:
    runs-on: ubuntu-latest
    needs: [build, e2e-api-tests, changes]
    if: github.event_name == 'merge_group'

    permissions:
      contents: read
      packages: read

    env:
      # Required: building the UI E2E projects restores the AppHost + Payment.Client/Contracts → Auth's and Payment's feed packages (see e2e-api-tests).
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GoogleApiKey: ${{ secrets.GOOGLE_API_KEY }}
      Stripe__SecretKey: ${{ secrets.STRIPE_SECRET_KEY }}
      ServiceAuth__B2BClientSecret: ${{ secrets.SERVICE_AUTH_B2B_CLIENT_SECRET }}
      ServiceAuth__CustomerClientSecret: ${{ secrets.SERVICE_AUTH_CUSTOMER_CLIENT_SECRET }}
      ServiceAuth__AuthClientSecret: ${{ secrets.SERVICE_AUTH_AUTH_CLIENT_SECRET }}

    steps:
      - name: Skip UI E2E (no runtime change)
        if: needs.changes.outputs.run_e2e != 'true'
        run: echo "No runtime change (non-code or package-only) -> skipping UI E2E; build + carve + unit + integration gate this."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run_e2e == 'true'

      - name: Set up .NET
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Provision HTTPS dev certificate
        if: needs.changes.outputs.run_e2e == 'true'
        run: |
          dotnet dev-certs https --trust || true  # Linux trust exits 4, but the cert is still generated
          echo "SSL_CERT_DIR=$HOME/.aspnet/dev-certs/trust:/etc/ssl/certs:/usr/lib/ssl/certs" >> "$GITHUB_ENV"

      - name: Install Stripe CLI
        if: needs.changes.outputs.run_e2e == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/stripe/stripe-cli/releases/latest | grep -oE 'https://[^"]+_linux_x86_64\.tar\.gz' | head -1)
          test -n "$url" || { echo "Stripe CLI linux_x86_64 asset not found"; exit 1; }
          curl -fsSL "$url" -o /tmp/stripe.tar.gz
          sudo tar -xzf /tmp/stripe.tar.gz -C /usr/local/bin stripe
          stripe version

      - name: Install Azure Functions Core Tools
        if: needs.changes.outputs.run_e2e == 'true'
        # Same as the API E2E job: the full AppHost boots the B2B Workers Azure Functions host,
        # which needs the `func` Core Tools on PATH to launch.
        run: |
          npm install -g azure-functions-core-tools@4 --unsafe-perm true
          func --version

      - name: Set up Node
        if: needs.changes.outputs.run_e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web SPA dependencies
        if: needs.changes.outputs.run_e2e == 'true'
        # The UI E2E AppHost serves the venue/artist/business/customer SPAs via `npm run dev` (Vite).
        # They live in the app/ npm workspace; node_modules is gitignored, so without this the dev
        # servers never start and every scenario fails at warm-up with ERR_CONNECTION_REFUSED.
        working-directory: app
        run: npm ci

      - name: Build B2B UI E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet build api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj --configuration Release

      - name: Build Customer UI E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet build api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release

      - name: Install Playwright browsers
        if: needs.changes.outputs.run_e2e == 'true'
        run: pwsh api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run B2B UI E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet test api/Concertable.B2B/tests/E2ETests/Concertable.B2B.E2ETests.Ui/Concertable.B2B.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings

      - name: Run Customer UI E2E tests
        if: needs.changes.outputs.run_e2e == 'true'
        run: dotnet test api/Concertable.Customer/tests/E2ETests/Concertable.Customer.E2ETests.Ui/Concertable.Customer.E2ETests.Ui.csproj --configuration Release --no-build --settings api/Concertable.runsettings

      - name: Upload E2E diagnostics
        # Server logs + Playwright traces/screenshots for diagnosing a UI failure. Failure-only:
        # the trace bundle is large (~hundreds of MB), so don't upload it on green runs.
        if: failure() && needs.changes.outputs.run_e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ui-diagnostics
          path: |
            **/e2e-diagnostics.log
            **/playwright-traces/**
            **/playwright-failures/**
          if-no-files-found: ignore
